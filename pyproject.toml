[project]
name = "intraday-experiment"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "pandas-market-calendars>=5,<6", "httpx[http2]>=0.28,<0.29"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
research = ["numpy>=2,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trader*"]
